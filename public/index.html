<script>
/* =========================
   SAFE CHAT HISTORY FIX
   ========================= */

let chatHistory = JSON.parse(localStorage.getItem("chat_history") || "[]");

// Save history safely
function saveHistory(role, content) {
	chatHistory.push({ role, content });
	localStorage.setItem("chat_history", JSON.stringify(chatHistory));
}

// Hook into DOM after messages appear
const observer = new MutationObserver(() => {
	const messages = document.querySelectorAll(".message");

	messages.forEach((msg, index) => {
		const p = msg.querySelector("p");
		if (!p) return;

		let text = p.innerHTML;

		// Convert links to clickable
		const urlRegex = /(https?:\/\/[^\s]+)/g;
		p.innerHTML = text.replace(urlRegex, (url) => {
			return `<a href="${url}" target="_blank" style="color:blue;text-decoration:underline">${url}</a>`;
		});
	});
});

// Start observing chat area
const chatBox = document.getElementById("chat-messages");
if (chatBox) {
	observer.observe(chatBox, {
		childList: true,
		subtree: true,
	});
}

/* =========================
   RESTORE OLD CHAT ON LOAD
   ========================= */
window.addEventListener("load", () => {
	const chatBox = document.getElementById("chat-messages");
	if (!chatBox) return;

	chatHistory.forEach((m) => {
		const div = document.createElement("div");
		div.className = `message ${m.role}-message`;
		div.innerHTML = `<p>${m.content}</p>`;
		chatBox.appendChild(div);
	});
});
</script>
